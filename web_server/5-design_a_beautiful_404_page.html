<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Ceci n'est pas une page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1e2a5a 0%, #0b1026 70%);
      color: #f5f5f5;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      overflow: hidden;
      text-align: center;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
    }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .box { position: relative; z-index: 1; padding: 2rem; }
    .code {
      font-size: clamp(6rem, 22vw, 14rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      background: linear-gradient(90deg, #ffb347, #ff5e62, #b06ab3);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
    }
    .planet {
      width: 90px;
      height: 90px;
      margin: 1rem auto;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffd194, #d1913c);
      box-shadow: 0 0 40px rgba(255, 179, 71, 0.5);
      animation: float 4s infinite ease-in-out;
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    h1 { font-size: 1.8rem; margin: 1rem 0 0.5rem; font-style: italic; }
    p { color: #b8c1ec; margin-bottom: 2rem; }
    a {
      display: inline-block;
      padding: 0.8rem 2rem;
      border-radius: 999px;
      background: #ff5e62;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s;
    }
    a:hover { transform: scale(1.08); }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <div class="planet"></div>
    <h1>Ceci n'est pas une page</h1>
    <p>This page drifted off into space. Even our best astronauts couldn't find it.</p>
    <a href="/">Take me back home</a>
  </div>
  <script>
    for (var i = 0; i < 120; i++) {
      var s = document.createElement("div");
      s.className = "star";
      s.style.top = Math.random() * 100 + "vh";
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDelay = Math.random() * 3 + "s";
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
